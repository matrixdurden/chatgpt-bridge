[package]
name = "chatgpt-bridge"
version = "0.2.2"
edition = "2024"
description = "A small self-hosted bridge that gives ChatGPT controlled access to a remote Linux development workspace."
repository = "https://github.com/matrixdurden/chatgpt-bridge"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
ngrok = "0.14"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
